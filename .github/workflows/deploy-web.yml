name: Deploy web

# Deploys only commits that passed CI web. Skipped until the Cloudflare Pages
# project exists (repository variable PAGES_PROJECT).
on:
  workflow_run:
    workflows: [CI web]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Shared with every workflow that deploys, so a code push never races the
# daily refresh.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.PAGES_PROJECT != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx wrangler pages deploy build/client --project-name="$PAGES_PROJECT" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
