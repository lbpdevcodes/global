name: Deploy web

# Deploys only commits that passed CI web, with the latest published snapshot.
# Skipped until Pages and R2 are configured (variables PAGES_PROJECT, R2_BUCKET).
on:
  workflow_run:
    workflows: [CI web]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Shared with every workflow that deploys, so a code push never races the
# daily refresh.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.PAGES_PROJECT != '' && vars.R2_BUCKET != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Fetch the latest snapshot
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 sync "s3://${{ vars.R2_BUCKET }}/latest/data/v1" data/v1 --endpoint-url "${{ vars.R2_ENDPOINT }}" --only-show-errors
      - run: npm run check:coverage
      - run: npm run build
      - run: npx wrangler pages deploy build/client --project-name="$PAGES_PROJECT" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
