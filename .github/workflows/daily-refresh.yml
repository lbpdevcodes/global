name: Daily refresh

# Refreshes every source, publishes a snapshot and deploys the reader.
# Skipped until R2 and Pages are configured (repository variables R2_BUCKET,
# R2_ENDPOINT, PAGES_PROJECT; secrets in README "Deployment").
on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      allow_empty_database:
        description: "First run only: start from an empty database"
        type: boolean
        default: false

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  RAILS_ENV: production
  RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
  DATABASE_STORE: s3://${{ vars.R2_BUCKET }}/engine
  R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  ALLOW_EMPTY_DATABASE: ${{ inputs.allow_empty_database && '1' || '' }}

jobs:
  refresh:
    if: vars.R2_BUCKET != '' && vars.PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Refresh sources and publish the snapshot
        working-directory: backend
        run: bin/with-stored-database bin/rails db:prepare db:seed data:refresh data:publish

      - name: Archive the snapshot
        working-directory: web
        run: |
          id=$(jq -r .snapshotId data/v1/manifest.json)
          aws s3 sync data/v1 "s3://${{ vars.R2_BUCKET }}/snapshots/$id/data/v1" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 sync data/v1 "s3://${{ vars.R2_BUCKET }}/latest/data/v1" --endpoint-url "$R2_ENDPOINT" --delete --only-show-errors

      - name: Build and deploy the reader
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npm run check:coverage
          npm run build
          npx wrangler pages deploy build/client --project-name="${{ vars.PAGES_PROJECT }}" --branch=main

      - name: Check freshness and list changes to review
        id: freshness
        working-directory: backend
        run: |
          bin/rails data:changes
          bin/rails data:freshness || echo "stale=true" >> "$GITHUB_OUTPUT"

      - name: Report failed sources, leadership changes and stale fields
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for report in backend/tmp/refresh-failures.md backend/tmp/changes.md backend/tmp/freshness.md; do
            if [ -s "$report" ] && { [ "$report" != backend/tmp/freshness.md ] || [ "${{ steps.freshness.outputs.stale }}" = true ]; }; then
              gh issue create --title "Daily refresh $(date -u +%F): $(basename "$report" .md)" --body-file "$report"
            fi
          done

      - name: Heartbeat
        if: success() && env.HEALTHCHECK_URL != ''
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" > /dev/null
